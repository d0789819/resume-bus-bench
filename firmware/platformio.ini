[platformio]
default_envs = esp32dev

[env:esp32dev]
; 與 esp32-c3-adblock 相同的平台版本（Arduino core 3.3.7 / ESP-IDF 5.5），本機已驗證可編譯，快取不必重新下載。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
board = esp32dev
; 使用預設分割表：NVS 一樣在 0x9000，因此先前存的 Wi-Fi 帳密燒錄後仍會保留。
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DFW_VERSION=\"0.1.0\"
    ; 關閉 Arduino HAL 的錯誤訊息：I2C 沒有從端時每次 NACK 都會印一行，會拖慢產生訊號
    -DCORE_DEBUG_LEVEL=0
